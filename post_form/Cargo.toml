[package]
name = "post_form"
version = "1.0.0"
edition = "2024"

[lib]
path = "src/handler.rs"

[dependencies]
axum = { version = "0.8.8", features = ["multipart"] }
chrono = { version = "0.4.42", features = ["serde"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tera = "2.0.0"
log = "0.4.29"
git2 = "0.21.0"
env_logger = "0.11.8"

[dev-dependencies]
pretty_assertions = "1.4.1"
