name: Deploy Scaleway Functions

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --workspace

  detect-changes:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    outputs:
      image_process: ${{ steps.changes.outputs.image_process }}
      image_revert: ${{ steps.changes.outputs.image_revert }}
      post_form: ${{ steps.changes.outputs.post_form }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            image_process:
              - 'image_process/**'
            image_revert:
              - 'image_revert/**'
            post_form:
              - 'post_form/**'

  image_process:
    needs: detect-changes
    if: needs.detect-changes.outputs.image_process == 'true'
    uses: Kyrremann/oslogigguide/.github/workflows/scaleway.yaml@main
    with:
      directory: image_process
      function-id: f7881fc0-2749-430d-a38b-6ba34d84afb2
    secrets:
      scaleway-token: ${{ secrets.SCW_SECRET_KEY }}

  image_revert:
    needs: detect-changes
    if: needs.detect-changes.outputs.image_revert == 'true'
    uses: Kyrremann/oslogigguide/.github/workflows/scaleway.yaml@main
    with:
      directory: image_revert
      function-id: f28e8c4b-27d3-4303-860b-d74085b19842
    secrets:
      scaleway-token: ${{ secrets.SCW_SECRET_KEY }}

  post_form:
    needs: detect-changes
    if: needs.detect-changes.outputs.post_form == 'true'
    uses: Kyrremann/oslogigguide/.github/workflows/scaleway.yaml@main
    with:
      directory: post_form
      function-id: 17e34739-4b76-4ea5-b535-bc1fda351f87
    secrets:
      scaleway-token: ${{ secrets.SCW_SECRET_KEY }}
